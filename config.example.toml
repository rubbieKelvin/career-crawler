# Copy to config.toml (git-ignored) and adjust. Every key is optional.

db_path = "data/career.db"
seeds_path = "seeds.txt"

[ui]
bind = "127.0.0.1"   # local only; see brainstorms/11-process-architecture.md
port = 7878

[crawler]
user_agent = "career-crawler/0.1"   # add a contact URL if you crawl a lot, e.g. "career-crawler/0.1 (+https://you.example)"
request_timeout_secs = 15
connect_timeout_secs = 10
max_body_bytes = 5242880              # 5 MiB, applied to wire and decompressed size of pages
max_resource_bytes = 52428800         # 50 MiB, for ATS API listings and sitemaps
max_redirects = 5
per_host_delay_ms = 1000              # robots.txt Crawl-delay can raise this per host
robots_ttl_secs = 86400
max_concurrency = 16                  # parallel fetches (one per host at most)
discovery_pages_per_domain = 3        # pages per domain until it's classified as a company (then deferred)
harvest_pages_per_domain = 30         # pages per company domain and per ATS job board
max_depth = 5                         # link hops from a seed
min_link_score = 1.0                  # links scoring lower are dropped
board_refresh_hours = 24               # re-fetch an ATS board API after this long
metrics_interval_secs = 2             # metrics sample period (live charts in the UI)
max_bytes = 0                         # stop after receiving this many bytes in a run; 0 = no cap
