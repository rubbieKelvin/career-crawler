# Copy to config.toml (git-ignored) and adjust. Every key is optional.

db_path = "data/areer.db"
seeds_path = "seeds.txt"

[ui]
bind = "127.0.0.1"   # local only; see brainstorms/11-process-architecture.md
port = 7878

[crawler]
user_agent = "areer-crawler/0.1"   # add a contact URL if you crawl a lot, e.g. "areer-crawler/0.1 (+https://you.example)"
request_timeout_secs = 15
connect_timeout_secs = 10
max_body_bytes = 5242880              # 5 MiB, applied to wire and decompressed size of pages
max_resource_bytes = 52428800         # 50 MiB, for ATS API listings and sitemaps
max_redirects = 5
per_host_delay_ms = 1000              # robots.txt Crawl-delay can raise this per host
robots_ttl_secs = 86400
max_concurrency = 16                  # parallel fetches (one per host at most)
discovery_pages_per_domain = 3        # pages per domain until it's classified as a company (then deferred)
harvest_pages_per_domain = 30         # pages per company domain and per ATS job board
max_depth = 5                         # link hops from a seed
min_link_score = 1.0                  # links scoring lower are dropped
board_refresh_hours = 24               # re-fetch an ATS board API after this long
metrics_interval_secs = 2             # metrics sample period (live charts in the UI)
max_bytes = 0                         # stop after receiving this many bytes in a run; 0 = no cap

# Optional LLM tier (brainstorms/10-llm.md): settles gray-zone domains, fills job fields the rules
# can't, and reads the UI's natural-language job search. Off by default. With no API key in the
# environment it is skipped with a warning (the search then falls back to matching the words).
[llm]
enabled = false
base_url = "https://api.deepseek.com"   # any OpenAI-compatible /chat/completions endpoint
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"        # the key is read from this environment variable
max_concurrency = 4
daily_token_budget = 2000000            # tokens (in + out) per rolling 24 h; 0 = no cap
request_timeout_secs = 60
input_price_per_mtok = 0.0              # USD per million tokens, only for the cost estimate in llm_calls
output_price_per_mtok = 0.0
enrich_batch_size = 10                  # jobs per enrichment call
send_cv = false                         # let the LLM read your CV (its text is sent to the provider); false = the local parser reads it
