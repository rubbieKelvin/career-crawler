[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
needless_return = "allow"

[workspace.dependencies]
career-core = { path = "crates/core" }
career-llm = { path = "crates/llm" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
blake3 = "1"
brotli = "8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
bytes = "1"
encoding_rs = "0.8"
flate2 = "1"
psl = "2"
reqwest = "0.13"
scraper = "0.27"
texting_robots = "0.2"
thiserror = "2"
wiremock = "0.6"
tokio-tungstenite = "0.30"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
